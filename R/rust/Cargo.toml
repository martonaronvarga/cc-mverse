# Cargo.toml - Rust dependencies

[package]
name = "multiverse-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
polars = { version = "0.52", features = ["parquet", "is_in", "lazy", "timezones", "csv", "polars-io", "dtype-full", "log"] }
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
itertools = "0.13"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.0", features = ["rt-multi-thread"], optional = true }
num_cpus = "1.16"

ndarray-stats = "0.5"                  # Order statistics, quantiles, percentiles
statrs = "0.16"                        # Probability distributions
average = "0.15"                       # P² streaming quantiles (memory efficient)
quantiles = "0.7"                      # Approximate quantile algorithms (CKMS, Greenwald-Khanna)
kolmogorov_smirnov = "1.1"
noisy_float = "0.2.0"

csv = "1.3"                            # CSV I/O
env_logger = "0.11"                    # Logging implementation

# Linear algebra & numerical
ndarray = "0.17"
# ndarray-linalg = { version = "0.18", features = ["openblas-static"] }
 
# Optional C++ interop (for statistical models)
cxx = { version = "1.0", optional = true }

rayon = "1.10"                         # Data-parallel operations with work stealing
which = "8.0.0"
ahash = "0.8.12"
polars-core = "0.53.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
criterion = "0.5"
proptest = "1.4"

[features]
default = ["rayon-backend"]
rayon-backend = []
cpp-models = ["cxx"]

[[bin]]
name = "process"
path = "src/bin/process.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
